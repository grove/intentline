name: offline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Fresh installs and read-only AI receipt (zero inference)
        run: python -B evaluation/package_smoke.py dist
      - run: python -m pip install .
      - run: python -B -m unittest discover -v
      - name: Read-only slicing evaluation receipt (POSIX)
        if: runner.os != 'Windows'
        run: python -B -m evaluation.slicing_04 report evaluation/results/slicing-04-not-run.json --private-root evaluation
      - name: Read-only 0.5 development receipts (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -B -m evaluation.planning_02 report evaluation/results/planning-05-not-run.json --private-root evaluation
          python -B -m evaluation.slicing_04 report evaluation/results/slicing-05-not-run.json --private-root evaluation
      - run: intentline --help
      - run: python -B -m intentline --help
  skills-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover and install all three standalone skills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-consumer"
          cd "$RUNNER_TEMP/skill-consumer"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list > found.txt
          for skill in intentline-plan intentline-audit intentline-slice; do
            grep -Fq "$skill" found.txt
          done
          npx --yes skills@latest add "$GITHUB_WORKSPACE" -a codex --copy -y
          for skill in intentline-plan intentline-audit intentline-slice; do
            test -f ".agents/skills/$skill/SKILL.md"
            grep -Fq "name: $skill" ".agents/skills/$skill/SKILL.md"
            cmp "$GITHUB_WORKSPACE/$skill/SKILL.md" ".agents/skills/$skill/SKILL.md"
          done
