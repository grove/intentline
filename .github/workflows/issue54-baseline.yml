name: Temporary Intentline #54 CLI version baseline

# Frozen historical baseline; deleted after the actual observation.
on:
  push:
    branches: [feat/54-cli-version]
    paths: [.github/workflows/issue54-baseline.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact original Intentline implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25e926f57e69395193fc0ac258f9e6dd2332cb18
          persist-credentials: false
      - name: Observe real R1 and R2 baseline commands without editing the target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intentline54-baseline"
          python3 -B - <<'PY'
          import json, hashlib, os, pathlib, subprocess, sys, time
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"intentline54-baseline"
          for name,argv in [
              ("R1", [sys.executable,"-B","-m","intentline","--version"]),
              ("R2", [sys.executable,"-B","-m","intentline","--json","--version"]),
          ]:
              start=time.monotonic()
              p=subprocess.run(argv,capture_output=True,check=False,timeout=30)
              (output/(name+".stdout")).write_bytes(p.stdout)
              (output/(name+".stderr")).write_bytes(p.stderr)
              row={"argv":argv,"cwd":os.getcwd(),"exit":p.returncode,
                   "elapsed_seconds":time.monotonic()-start,
                   "stdout_sha256":hashlib.sha256(p.stdout).hexdigest(),
                   "stderr_sha256":hashlib.sha256(p.stderr).hexdigest()}
              (output/(name+".json")).write_text(json.dumps(row,indent=2)+"\n")
              print(name,"exit",p.returncode,"stdout",p.stdout.decode(errors="replace"),
                    "stderr",p.stderr.decode(errors="replace"))
          PY
      - name: Upload observed historical baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intentline-54-baseline
          path: ${{ runner.temp }}/intentline54-baseline/
          retention-days: 7
          if-no-files-found: warn
