[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentline"
version = "0.1.0"
description = "Source-grounded acceptance agreements, without implementation or proof"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
intentline = "intentline.cli:main"

[tool.setuptools.packages.find]
include = ["intentline*"]

[tool.setuptools.data-files]
"share/intentline/schema" = ["schema/*.json"]
"share/intentline/skills/intentline-plan" = ["skills/intentline-plan/SKILL.md"]
"share/intentline/skills/intentline-audit" = ["skills/intentline-audit/SKILL.md"]
"share/intentline/docs" = ["docs/*.md"]
"share/intentline/examples/username-validation" = ["examples/username-validation/*"]
