[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentline"
version = "0.5.0rc1"
description = "Source-grounded acceptance agreements, without implementation or proof"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
intentline = "intentline.cli:main"

[tool.setuptools.packages.find]
include = ["intentline*", "evaluation"]

[tool.setuptools.data-files]
"share/intentline/schema" = ["schema/*.json"]
"share/intentline/skills/intentline-plan" = ["skills/intentline-plan/*.md"]
"share/intentline/skills/intentline-audit" = ["skills/intentline-audit/*.md"]
"share/intentline/skills/intentline-slice" = ["skills/intentline-slice/*.md"]
"share/intentline/docs" = ["docs/*.md"]
"share/intentline/examples/slicing" = ["examples/slicing/*"]
"share/intentline/examples/username-validation" = ["examples/username-validation/*"]
"share/intentline/evaluation" = ["evaluation/*.md"]
"share/intentline/evaluation/cases/ai_06" = ["evaluation/cases/ai_06/*.md", "evaluation/cases/ai_06/*.txt", "evaluation/cases/ai_06/*.json", "evaluation/cases/ai_06/access_canaries.py"]
"share/intentline/evaluation/cases/ai_06/not-run-packet" = ["evaluation/cases/ai_06/not-run-packet/study.json", "evaluation/cases/ai_06/not-run-packet/registration.sha256"]
"share/intentline/evaluation/cases/ai_06/not-run-packet/instructions" = ["evaluation/cases/ai_06/not-run-packet/instructions/*.txt"]
"share/intentline/evaluation/cases/ai_06/not-run-packet/receipts" = ["evaluation/cases/ai_06/not-run-packet/receipts/*.json"]
"share/intentline/evaluation/results" = ["evaluation/results/ai-development-06-*.json", "evaluation/results/ai-development-06-*.sha256"]
